name: Windows review build
run-name: WD01 ${{ github.sha }}
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blobber-distribution-manual
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      prepared-key: ${{ steps.key.outputs.key }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve prepared identity
        id: key
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 12*1024**3'
          echo "key=$(python3 tools/distribution/prepared.py key)" >> "$GITHUB_OUTPUT"
          echo "RUN_DIR=$(python3 tools/agent_artifacts.py create)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: publication
        with:
          path: output/wd01-prepared
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
      - name: Native Linux preparation on cache miss
        if: steps.publication.outputs.cache-hit != 'true'
        run: nice -n 15 ionice -c 3 python3 tools/distribution/hosted_prepare.py --run-dir "$RUN_DIR"
      - name: Check portable transfer
        run: python3 tools/distribution/prepared.py verify --bundle output/wd01-prepared
      - name: Clean owned diagnostics
        if: always()
        run: |
          if test -n "$RUN_DIR"; then
            python3 tools/agent_artifacts.py clean "$RUN_DIR"
            python3 tools/agent_artifacts.py clean "$RUN_DIR" --apply
          fi

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      LP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/wd01-prepared
          key: ${{ needs.prepare.outputs.prepared-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Native MSVC build, focused tests and extracted ZIP verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Source revision differs' }
          $dev = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$dev`" -arch=x64 -host_arch=x64 -vcvars_ver=14.44 -winsdk=10.0.22621.0 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC environment initialization failed' }
          $run = python tools/agent_artifacts.py create
          "RUN_DIR=$run" >> $env:GITHUB_ENV
          python tools/windows_release.py --run-dir $run --prepared-input output/wd01-prepared
          if ($LASTEXITCODE -ne 0) { throw 'Windows review build failed' }
      - name: Upload review ZIP and compact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-review-${{ github.sha }}
          path: build-windows-release/dist/blobber-*/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Compact failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          if ($env:RUN_DIR) {
            Get-ChildItem $env:RUN_DIR -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content $_.FullName -Tail 50
            }
          }
      - name: Clean owned diagnostics
        if: always()
        shell: pwsh
        run: |
          if ($env:RUN_DIR) {
            python tools/agent_artifacts.py clean $env:RUN_DIR
            python tools/agent_artifacts.py clean $env:RUN_DIR --apply
          }
