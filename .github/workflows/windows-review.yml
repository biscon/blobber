name: Windows review build
run-name: WD01 ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      code_check:
        description: 'Compile/link and run owned tests only (no preparation or review ZIP)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blobber-distribution-manual
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write # Delete only the owned prepared-cache namespace before a manual build.
    outputs:
      prepared-key: ${{ steps.key.outputs.key }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve prepared identity
        id: key
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 12*1024**3'
          echo "key=$(python3 tools/distribution/prepared.py key)" >> "$GITHUB_OUTPUT"
          echo "RUN_DIR=$(python3 tools/agent_artifacts.py create)" >> "$GITHUB_ENV"
      - name: Bound owned prepared cache storage
        if: ${{ !inputs.code_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_KEY: ${{ steps.key.outputs.key }}
        run: python3 tools/distribution/manage_cache.py "$PREPARED_KEY"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !inputs.code_check }}
        id: publication
        with:
          path: output/wd01-prepared
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
      - name: Native Linux preparation on cache miss
        if: ${{ !inputs.code_check && steps.publication.outputs.cache-hit != 'true' }}
        run: nice -n 15 ionice -c 3 python3 tools/distribution/hosted_prepare.py --run-dir "$RUN_DIR"
      - name: Check portable transfer
        if: ${{ !inputs.code_check }}
        run: python3 tools/distribution/prepared.py verify --bundle output/wd01-prepared
      - name: Clean owned diagnostics
        if: always() && !cancelled()
        run: |
          if test -n "$RUN_DIR"; then
            python3 tools/agent_artifacts.py clean "$RUN_DIR"
            python3 tools/agent_artifacts.py clean "$RUN_DIR" --apply
          fi

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      LP_NUM_THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
      CODE_CHECK: ${{ inputs.code_check }}
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !inputs.code_check }}
        with:
          path: output/wd01-prepared
          key: ${{ needs.prepare.outputs.prepared-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Native MSVC build and selected verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Source revision differs' }
          $dev = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$dev`" -arch=x64 -host_arch=x64 -vcvars_ver=14.44 -winsdk=10.0.22621.0 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC environment initialization failed' }
          $run = python tools/agent_artifacts.py create
          "RUN_DIR=$run" >> $env:GITHUB_ENV
          $arguments = @('--run-dir', $run)
          if ($env:CODE_CHECK -eq 'true') { $arguments += '--code-check' }
          else { $arguments += @('--prepared-input', 'output/wd01-prepared') }
          python tools/windows_release.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows review build failed' }
      - name: Upload game ZIP (single download, no wrapper)
        if: ${{ !inputs.code_check }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build-windows-release/dist/blobber-*/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Upload game checksum
        if: ${{ !inputs.code_check }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build-windows-release/dist/blobber-*/*.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Upload optional review evidence
        if: ${{ !inputs.code_check }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-review-evidence
          path: |
            build-windows-release/dist/blobber-*/
            !build-windows-release/dist/blobber-*/*.zip
            !build-windows-release/dist/blobber-*/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Compact failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          if ($env:RUN_DIR) {
            Get-ChildItem $env:RUN_DIR -Filter '*.log' | ForEach-Object {
              Write-Output $_.Name
              Get-Content $_.FullName -Tail 50
            }
          }
      - name: Clean owned diagnostics
        if: always() && !cancelled()
        shell: pwsh
        run: |
          if ($env:RUN_DIR) {
            python tools/agent_artifacts.py clean $env:RUN_DIR
            python tools/agent_artifacts.py clean $env:RUN_DIR --apply
          }
