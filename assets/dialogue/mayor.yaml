# Edit each response as a linear screenplay. See README.md for defaults.
version: 2
primary: mayor
participants:
  mayor:
    resident: sanctuary.mayor
    name: Mayor
  boric:
    resident: sanctuary.boric
    name: Boric
    text_color: '#9FD6D3'
  balin:
    resident: sanctuary.balin
    name: Balin
    text_color: '#C7B6E8'
facts:
- heard_guards_lunch
greeting:
  beats:
  - speaker: mayor
    text: |
      Have you heard anything of Gwendolyn? Then tell me!
introduction:
  beats:
  - speaker: mayor
    text: |
      You there! Adventurers! My daughter Gwendolyn was kidnapped last night. Monsters came up from the dungeon beneath Sanctuary and carried her away!
  - speaker: mayor
    text: |
      My beautiful daughter, dragged into that wretched place! Find her and bring her home safely. Boric and Balin are assisting me with the investigation. Their principal contribution so far has been standing there.
topics:
- id: about
  label: What happened?
  kind: introduction
- id: gwendolyn
  label: Gwendolyn
  responses:
    - beats:
      - speaker: mayor
        text: |
          Muck-rakers! Ye must recognize Gwendolyn upon thy sight! Watchmen! Produce the official royal tapestry from the town archives post-haste, that these sell-swords mayest know whom they seek!
        animation: talk
      - speaker: boric
        text: |
          Verily, sire... heh, heh... lookest thou upon this scroll. I holdeth a most wondrous rendering of the maiden right here within my breastplate. 'Tis the freshest parchment in all the realm.
        camera:
          target: boric
          duration_ms: 300
        animation: pull_document
        audio: dialogue/boric-chuckle.wav
        overlay_asset: dialogue/onlyscrolls_overlay.png
        overlay_delay_ms: 700 # Let the four 150 ms document-pull frames finish first.
        overlay_dismiss_on_advance: true
      - speaker: balin
        text: |
          Hark! Eh-heh-heh. Gaze thy eyes upon the density of this canvas, knave. The premium tier of OnlyScrolls is delivered via swift, majestic ravens rather than the common, peasant pigeon. I didst spendeth three whole hours self-abusing mine own rod in the barracks yesternight whilst gazing upon it. Triumphant.
        camera:
          target: balin
          duration_ms: 400
        animation: laugh
        audio: dialogue/balin-chuckle.wav
      - speaker: boric
        text: |
          Aye, heh, heh. Yet the vellum groweth exceedingly rigid, sire. Methinks it suffereth from... exposure to the damp humors of the dungeon air. Heh.
        camera:
          target: boric
          duration_ms: 400
        animation: talk
      - speaker: mayor
        text: |
          THAT IS NO REGISTRY OF THE CROWN! 'TIS A PROFLIGATE SUBSCRIPTION SCROLL FROM THE RAVEN-FEEDERS! AND FOR WHAT REASON ART THE CORNERS CRUSTED AND BOUND TOGETHER?!
        camera:
          target: mayor
          duration_ms: 200
        animation: explosive_rage
        audio: dialogue/mayor-groan.wav
        clear_overlay: true
- id: kidnapping
  label: The kidnapping
  responses:
  - beats:
    - speaker: mayor
      text: |
        It happened during the night. Monsters from below took her before we could stop them. I need people who can go after her, not another explanation of why nobody noticed!
- id: dungeon
  label: The dungeon
  responses:
  - beats:
    - speaker: mayor
      text: |
        They took her into the dungeon beneath our town. I do not know how far down. Find her, and do not let your courage outrun your sense. She needs rescuers who can make it back.
- id: guards
  label: Your guards
  responses:
  - set_fact: heard_guards_lunch
    beats:
    - speaker: mayor
      text: |
        Boric and Balin have been investigating all morning. I await their report.
      animation: talk
    - speaker: boric
      text: |
        We investigated lunch twice.
      camera:
        target: boric
        duration_ms: 200
      animation: laugh
      audio: dialogue/boric-chuckle.wav
    - speaker: mayor
      text: |
        My daughter is missing. The sandwiches are not suspects!
      animation: talk
    - speaker: balin
      text: |
        Not any more, sir. We eliminated them.
      animation: laugh
      audio: dialogue/balin-chuckle.wav
    - speaker: mayor
      text: |
        Their dedication to the wrong task is extraordinary. Please find Gwendolyn.
      animation: talk
      audio: dialogue/mayor-groan.wav
  - when_fact: heard_guards_lunch
    beats:
    - speaker: mayor
      text: |
        I have forbidden further investigations of lunch.
    - speaker: boric
      text: |
        Good news, sir. We have a lead on supper.
      animation: laugh
      audio: dialogue/boric-chuckle.wav
    - speaker: balin
      text: |
        A very promising stew.
      animation: laugh
      audio: dialogue/balin-chuckle.wav
    - speaker: mayor
      text: |
        Do you see what I have to work with? Find my daughter.
      animation: talk
      audio: dialogue/mayor-groan.wav
- id: farewell
  label: Farewell
  kind: farewell
