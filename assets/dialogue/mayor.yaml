# Edit each response as a linear screenplay. See README.md for defaults.
version: 2
primary: mayor
participants:
  mayor:
    resident: sanctuary.mayor
    name: Mayor
  boric:
    resident: sanctuary.boric
    name: Boric
    text_color: '#9FD6D3'
  balin:
    resident: sanctuary.balin
    name: Balin
    text_color: '#C7B6E8'
facts:
- heard_guards_lunch
greeting:
  beats:
    - speaker: mayor
      text: |
        Hast thou uncovered tidings of fair Gwendolyn? Then speaketh post-haste, I command thee!
      animation: talk
      audio: dialogue/mayor-torben3.wav
introduction:
  beats:
    - speaker: mayor
      text: |
        Hold, ye travelers! Adventurers of fortune! Mine own daughter Gwendolyn was foully abducted yesternight. Vile fiends didst ascend from the dark dungeons beneath Sanctuary and carried her away into the abyss!
      animation: talk
      audio: dialogue/mayor-torben1.wav
    - speaker: mayor
      text: |
        My beautiful flesh and blood, dragged into that most wretched, damp hollow! Find her, I beseech thee, and return her safely to the surface. Boric and Balin are meant to be assisting mine office with this investigation. Yet their principal contribution to the crown thus far hath been merely standing there like static pillars of meat.
      animation: talk
      audio: dialogue/mayor-torben2.wav
    - speaker: boric
      text: |
        Uhhh.. heh hehe.
      camera:
        target: boric
        duration_ms: 400
      audio: dialogue/uh1.wav
    - speaker: mayor
      text: |
        Thou must find her post-haste!!.
      animation: talk
      audio: dialogue/mayor-torben3.wav
      camera:
        target: mayor
        duration_ms: 300
topics:
- id: about
  label: What happened?
  kind: introduction
- id: gwendolyn
  label: Gwendolyn
  responses:
    - beats:
      - speaker: mayor
        text: |
          Muck-rakers! Ye must recognize Gwendolyn upon thy sight! Watchmen! Produce the official royal tapestry from the town archives post-haste, that these sell-swords mayest know whom they seek!
        animation: talk
        audio: dialogue/mayor-torben2.wav
      - speaker: boric
        text: |
          Verily, sire... heh, heh... lookest thou upon this scroll. I holdeth a most wondrous rendering of the maiden right here within my breastplate. 'Tis the freshest parchment in all the realm.
        camera:
          target: boric
          duration_ms: 300
        animation: pull_document
        audio: dialogue/boric-chuckle.wav
        overlay_asset: dialogue/onlyscrolls_overlay.png
        overlay_delay_ms: 700 # Let the four 150 ms document-pull frames finish first.
        overlay_dismiss_on_advance: true
      - speaker: balin
        text: |
          Hark! Eh-heh-heh. Thou didst say 'breast'... eh-heh. Gaze thy eyes upon the sheer density of this canvas, knave! The premium tier of OnlyScrolls is delivered via swift, majestic ravens rather than the common, peasant pigeon. I didst spendeth three whole hours self-abusing mine own rod in the barracks yesternight whilst gazing upon it. Triumphant.
        camera:
          target: balin
          duration_ms: 400
        animation: laugh
        audio: dialogue/balin-chuckle.wav
      - speaker: boric
        text: |
          Aye, heh, heh. Yet the vellum groweth exceedingly rigid, sire. Methinks it suffereth from... exposure to the damp humors of the dungeon air. Heh.
        camera:
          target: boric
          duration_ms: 400
        animation: talk
      - speaker: mayor
        text: |
          THAT IS NO REGISTRY OF THE CROWN! 'TIS A PROFLIGATE SUBSCRIPTION SCROLL FROM THE RAVEN-FEEDERS! AND FOR WHAT REASON ART THE CORNERS CRUSTED AND BOUND TOGETHER?!
        camera:
          target: mayor
          duration_ms: 200
        animation: explosive_rage
        audio: dialogue/mayor-torben1.wav
        clear_overlay: true
- id: kidnapping
  label: The kidnapping
  responses:
    - beats:
        - speaker: mayor
          text: |
            The foul deed didst transpire during the dead of night! Vile abominations from the abyss didst seize her before any soul couldst raise a blade to halt their escape. I require sturdy sell-swords who possesseth the spine to descend after her -- not another lengthy parchment explaining why mine own watchmen noticed absolutely naught!
          animation: talk
          audio: dialogue/mayor-torben2.wav
- id: dungeon
  label: The dungeon
  responses:
    - beats:
      - speaker: mayor
        text: |
          They dragged her into the dark abyss beneath our town! I knowest not how many tiers down she abideth. Ye shall encounter endless, damp mineshafts plunging into the void!
        animation: talk
        audio: dialogue/mayor-torben2.wav
      - speaker: boric
        text: |
          Hark! Heh, heh. Thou didst say 'shafts'... eh-heh-heh.
        camera:
          target: boric
          duration_ms: 300  # Snappy comedic whip-pan
        animation: laugh
        audio: dialogue/boric-chuckle.wav
      - speaker: balin
        text: |
          Aye, heh, heh. Plunging deep into the dark hole... eh-heh. Tremendous.
        camera:
          target: balin
          duration_ms: 400
        animation: laugh
        audio: dialogue/balin-chuckle.wav
      - speaker: mayor
        text: |
          SILENCE, YE BLITHERING KNAVES! Find my flesh and blood, and let not thy courage outrun thy sense. She requireth rescuers who canst actually returnest alive!
        camera:
          target: mayor
          duration_ms: 200  # Furious rage snap-back
        animation: explosive_rage
        audio: dialogue/mayor-torben1.wav
- id: guards
  label: Your guards
  responses:
    - set_fact: heard_guards_lunch
      beats:
        - speaker: mayor
          text: |
            Boric and Balin have been diligently investigating since the first light of dawn. Verily, I await their official report with bated breath.
          animation: talk
          audio: dialogue/mayor-torben2.wav
        - speaker: boric
          text: |
            Hark, sire! Heh, heh. We didst thoroughly investigate the midday feast... twice, in fact.
          camera:
            target: boric
            duration_ms: 200
          animation: laugh
          audio: dialogue/boric-chuckle.wav
        - speaker: mayor
          text: |
            Mine own flesh and blood is missing! The tavern sandwiches art not suspects in this treason!
          animation: talk
          audio: dialogue/mayor-torben3.wav
        - speaker: balin
          text: |
            Not any longer, your grace. Eh-heh. We didst completely eliminate them from the realm. Triumphant.
          camera:
            target: balin
            duration_ms: 400
          animation: laugh
          audio: dialogue/balin-chuckle.wav
        - speaker: mayor
          text: |
            Their unyielding dedication to the entirely wrong endeavor is truly extraordinary. I beseech thee, go forth and find Gwendolyn.
          animation: talk
          audio: dialogue/mayor-torben1.wav
    - when_fact: heard_guards_lunch
      beats:
        - speaker: mayor
          text: |
            Henceforth, I have strictly forbidden further investigations concerning the midday feast!
          animation: talk
          audio: dialogue/mayor-torben3.wav
        - speaker: boric
          text: |
            Joyous tidings, sire! Heh, heh. We have uncovered a most promising lead regarding supper.
          camera:
            target: boric
            duration_ms: 200
          animation: laugh
          audio: dialogue/boric-chuckle.wav
        - speaker: balin
          text: |
            Aye, eh-heh. A highly suspicious, robustly seasoned stew abideth in the kitchen.
          camera:
            target: balin
            duration_ms: 400
          animation: laugh
          audio: dialogue/balin-chuckle.wav
        - speaker: mayor
          text: |
            Dost thou witness the utter baseline human material I am forced to endure? Find my daughter!
          animation: talk
          audio: dialogue/mayor-torben2.wav
- id: farewell
  label: Farewell
  kind: farewell
